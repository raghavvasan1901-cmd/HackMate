<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b35">
  <title>HackMate — Find your people. Build what matters.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard"><span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span><span>hackmate<span class="brand-dot">.</span><small>BUILD BETTER, TOGETHER</small></span></a>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="app-nav" aria-label="Main navigation">
        <button data-page="dashboard" aria-label="Overview" title="Overview"><i class="bi bi-grid-1x2" aria-hidden="true"></i><span class="nav-label">Overview</span></button>
        <button data-page="opportunities" aria-label="Discover" title="Discover"><i class="bi bi-compass" aria-hidden="true"></i><span class="nav-label">Discover</span></button>
        <button data-page="calendar" aria-label="Hackathon calendar" title="Hackathon calendar"><i class="bi bi-calendar3" aria-hidden="true"></i><span class="nav-label">Hackathon calendar</span></button>
        <button data-page="teams" aria-label="Teams" title="Teams"><i class="bi bi-people" aria-hidden="true"></i><span class="nav-label">Teams</span></button>
        <button data-page="create-team" aria-label="Start a team" title="Start a team"><i class="bi bi-plus-square" aria-hidden="true"></i><span class="nav-label">Start a team</span></button>
        <button data-page="create-opportunity" aria-label="Post opportunity" title="Post opportunity"><i class="bi bi-megaphone" aria-hidden="true"></i><span class="nav-label">Post opportunity</span></button>
        <div class="nav-caption mt-4">YOUR TEAM</div>
        <button data-page="matching" aria-label="Smart matching" title="Smart matching"><i class="bi bi-stars" aria-hidden="true"></i><span class="nav-label">Smart matching</span></button>
        <button data-page="balance" aria-label="Team balance" title="Team balance"><i class="bi bi-bar-chart-line" aria-hidden="true"></i><span class="nav-label">Team balance</span></button>
        <button data-page="workspace" aria-label="Workspace and tasks" title="Workspace and tasks"><i class="bi bi-kanban" aria-hidden="true"></i><span class="nav-label">Workspace &amp; tasks</span></button>
        <button data-page="chat" aria-label="Team chat" title="Team chat"><i class="bi bi-chat-left-text" aria-hidden="true"></i><span class="nav-label">Team chat</span></button>
        <button data-page="applications" aria-label="Applications" title="Applications"><i class="bi bi-inbox" aria-hidden="true"></i><span class="nav-label">Applications</span></button>
        <button data-page="invitations" aria-label="Invitations" title="Invitations"><i class="bi bi-envelope-paper" aria-hidden="true"></i><span class="nav-label">Invitations</span><span class="nav-badge" id="invitation-count" hidden></span></button>
        <div class="nav-caption mt-4">GROW</div>
        <button data-page="roadmaps" aria-label="Learning roadmaps" title="Learning roadmaps"><i class="bi bi-signpost-split" aria-hidden="true"></i><span class="nav-label">Learning roadmaps</span></button>
        <button data-page="challenges" aria-label="Mock hackathon" title="Mock hackathon"><i class="bi bi-trophy" aria-hidden="true"></i><span class="nav-label">Mock hackathon</span></button>
        <button data-page="reviews" aria-label="Reviews" title="Reviews"><i class="bi bi-star" aria-hidden="true"></i><span class="nav-label">Reviews</span></button>
        <button data-page="reputation" aria-label="Reputation" title="Reputation"><i class="bi bi-person-badge" aria-hidden="true"></i><span class="nav-label">Reputation</span></button>
        <button data-page="notifications" aria-label="Notifications" title="Notifications"><i class="bi bi-bell" aria-hidden="true"></i><span class="nav-label">Notifications</span><span class="nav-badge" id="nav-notification-count" hidden></span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note"><i class="bi bi-lightbulb"></i><span>Great teams aren't found.<br><strong>They're built together.</strong></span></div>
        <button class="account-button" data-page="profile"><span class="avatar avatar-small" id="nav-avatar">HM</span><span class="account-label"><strong id="nav-name">Welcome!</strong><small id="nav-status">Sign in to get started</small></span><i class="bi bi-chevron-right ms-auto"></i></button>
        <button id="logout-button" class="text-start w-100 mt-2 border-0 bg-transparent text-secondary small" data-action="logout" hidden><i class="bi bi-box-arrow-right me-2"></i>Sign out</button>
      </div>
    </aside>
    <main class="main-column">
      <header class="topbar">
        <button class="mobile-menu btn btn-sm" id="mobile-menu" aria-label="Toggle menu" aria-controls="sidebar" aria-expanded="false"><i class="bi bi-list"></i></button>
        <div class="topbar-title-group"><button class="sidebar-toggle icon-button" id="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true"><i class="bi bi-layout-sidebar-inset"></i></button><div class="breadcrumb-label"><span>HackMate</span><i class="bi bi-chevron-right"></i><strong id="page-crumb">Overview</strong></div></div>
        <div class="topbar-actions"><button class="icon-button notification-button" data-page="notifications" aria-label="Notifications"><i class="bi bi-bell"></i><span class="notification-dot" hidden></span><span class="topbar-notification-count" id="notification-count" hidden></span></button><button class="topbar-cta" data-page="create-team"><i class="bi bi-plus-lg"></i><span>New team</span></button><button class="topbar-account" id="topbar-account" data-page="profile" aria-label="Open your profile" hidden><span class="avatar avatar-small" id="topbar-avatar">HM</span><span class="topbar-account-label" id="topbar-name"></span><i class="bi bi-chevron-down"></i></button><button class="topbar-signin" id="topbar-signin" data-page="login">Sign in</button></div>
      </header>
      <section id="content" class="content-area" aria-live="polite" aria-busy="true"><div class="loading-state" role="status"><span class="spinner-border spinner-border-sm"></span> Loading HackMate…</div></section>
      <footer class="footer"><span>Made for the next big idea <span class="brand-dot">♥</span></span><a href="/docs" target="_blank">API documentation <i class="bi bi-arrow-up-right"></i></a></footer>
    </main>
  </div>
  <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" hidden></button>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
